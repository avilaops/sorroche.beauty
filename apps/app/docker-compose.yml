services:
  app:
    build: .
    container_name: sorroche-app
    restart: unless-stopped
    # O Postgres roda no host, alcançável pela bridge do Docker.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      AUTH_TRUST_HOST: "true"
    ports:
      - "127.0.0.1:3031:3000"
